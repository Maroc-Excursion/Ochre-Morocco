<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — Ochre Morocco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#0E5A47;--gold:#C89B3C;--navy:#0F2238;--sand:#E8D9B5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--navy),var(--green));font-family:Poppins,sans-serif;color:#fff}
    .card{width:min(100%,430px);background:#fff;color:var(--navy);border-radius:22px;padding:40px;box-shadow:0 24px 70px #06152266}
    .brand{text-align:center;margin-bottom:28px}.brand-mark{width:64px;height:64px;margin:auto;border-radius:18px;background:var(--green);display:grid;place-items:center;color:var(--sand);font-size:26px}
    h1{font:700 27px 'Playfair Display',serif;margin:16px 0 5px}.brand p{margin:0;color:#64748b;font-size:13px}
    label{display:block;font-size:13px;font-weight:600;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d9e0e7;border-radius:10px;font:inherit;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #0e5a4720}
    button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:var(--green);color:#fff;font:600 15px Poppins;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
    .error{display:none;margin-top:16px;padding:11px 13px;border-radius:9px;background:#fff1f0;color:#b42318;font-size:13px;line-height:1.6}.back{display:block;text-align:center;margin-top:22px;color:var(--green);font-size:12px;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="brand-mark">OM</div><h1>لوحة Ochre Morocco</h1><p>إدارة الرحلات والحجوزات</p></div>
    <form id="login-form">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" required dir="ltr" placeholder="ochremorocco@gmail.com">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required dir="ltr">
      <button id="login-button" type="submit">تسجيل الدخول</button>
      <div id="login-error" class="error" role="alert"></div>
    </form>
    <a class="back" href="../index.html">العودة إلى الموقع</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    (async function () {
      var client = window.OchreSupabase && window.OchreSupabase.client;
      var form = document.getElementById('login-form');
      var error = document.getElementById('login-error');
      var button = document.getElementById('login-button');
      if (!client) { error.textContent = 'تعذر تحميل خدمة الدخول. تحقق من الاتصال ثم أعد المحاولة.'; error.style.display = 'block'; return; }
      var current = await client.auth.getSession();
      if (current.data.session) { window.location.replace('dashboard.html'); return; }
      form.addEventListener('submit', async function (event) {
        event.preventDefault(); error.style.display = 'none'; button.disabled = true; button.textContent = 'جارٍ التحقق…';
        var result = await client.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
        if (result.error) {
          error.textContent = result.error.message === 'Invalid login credentials' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' : 'تعذر تسجيل الدخول. تحقق من البيانات وحاول مرة أخرى.';
          error.style.display = 'block'; button.disabled = false; button.textContent = 'تسجيل الدخول'; return;
        }
        window.location.replace('dashboard.html');
      });
    })();
  </script>
</body>
</html>
