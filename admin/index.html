<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ochre Morocco | لوحة التحكم</title><style>:root{font-family:system-ui,sans-serif;color:#15251f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #dce8e1;border-radius:18px;padding:24px;box-shadow:0 12px 35px #12311b12}.login{max-width:460px;margin:9vh auto}.brand{color:#0e5a47;font-size:26px;font-weight:800}.muted{color:#697a72}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{border:1px solid #d4e1d9;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 16px;background:#0e5a47;color:#fff;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#eef4f0;color:#0e5a47}button.danger{background:#b42318}.bar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:20px}.error,.success{padding:10px;border-radius:9px;display:none}.error{color:#b42318;background:#fff0ef}.success{color:#086b43;background:#ecfff5}.service{border:1px solid #dce8e1;border-radius:14px;padding:14px;display:grid;gap:8px}.service img{width:100%;height:140px;object-fit:cover;border-radius:10px}.price{font-weight:800;color:#0e5a47}.hidden{display:none!important}@media(max-width:600px){.shell{padding:12px}.panel{padding:16px}}</style></head><body><main class="shell"><section id="login" class="panel login"><div class="brand">Ochre Morocco</div><p class="muted">دخول آمن إلى لوحة التحكم</p><form id="loginForm" class="form"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button>دخول</button></form></section><section id="app" class="hidden"><div class="bar"><div><div class="brand">Ochre Morocco</div><div class="muted">إدارة المحتوى المشترك بين الموقع والتطبيق</div></div><div class="actions"><button id="newService">إضافة خدمة</button><button id="logout" class="secondary">خروج</button></div></div><div class="grid"><section class="panel"><h2>الخدمات المنشورة</h2><div id="services" class="grid"></div></section><section class="panel"><h2>تغيير كلمة المرور</h2><form id="passwordForm" class="form"><div class="field"><label>كلمة المرور الحالية</label><input id="currentPassword" type="password" required></div><div class="field"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="newPassword" type="password" minlength="10" required></div><div id="passwordMessage" class="success"></div><button>حفظ كلمة المرور</button></form></section></div></section><dialog id="serviceDialog"><form id="serviceForm" method="dialog" class="panel"><h2>إضافة أو تعديل خدمة</h2><div class="form"><div class="field"><label>العنوان</label><input id="title" required></div><div class="field"><label>العنوان بالعربية</label><input id="titleAr"></div><div class="grid"><div class="field"><label>التصنيف</label><select id="category"><option value="excursion">رحلة</option><option value="circuit">دائرة سياحية</option><option value="transfer">نقل</option><option value="activity">نشاط</option></select></div><div class="field"><label>السعر</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>العملة</label><input id="currency" value="EUR" required></div></div><div class="field"><label>المدة</label><input id="duration"></div><div class="field"><label>الوصف</label><textarea id="description"></textarea></div><div class="field"><label>الصورة (حد أقصى 5MB)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div id="serviceError" class="error"></div><div class="actions"><button type="submit">حفظ</button><button type="button" id="cancelDialog" class="secondary">إلغاء</button></div></div></form></dialog></main><script>
    var API="/api",editing=null;function $(id){return document.getElementById(id)}function show(id,text,success){$(id).textContent=text;$(id).style.display=text?"block":"none";$(id).className=success?"success":"error"}async function api(path,options){options=options||{};var headers=Object.assign({"Content-Type":"application/json"},options.headers||{});var response=await fetch(API+path,Object.assign({},options,{credentials:"include",headers:headers}));if(response.status===204)return null;var data=await response.json().catch(function(){return{}});if(!response.ok)throw new Error(data.error||"REQUEST_FAILED");return data}function esc(value){return String(value==null?"":value).replace(/[&<>\"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function readImage(file){return file?new Promise(function(resolve,reject){if(file.size>5242880)return reject(new Error("IMAGE_TOO_LARGE"));var reader=new FileReader();reader.onload=function(){resolve(reader.result)};reader.onerror=function(){reject(new Error("IMAGE_READ_FAILED"))};reader.readAsDataURL(file)}):Promise.resolve(undefined)}async function load(){var data=await api("/admin/services");$("services").innerHTML="";data.services.forEach(function(service){var card=document.createElement("article");card.className="service";card.innerHTML=(service.imageUrl?"<img src=\""+service.imageUrl+"\" alt=\"\">":"")+"<strong>"+esc(service.title)+"</strong><span class=\"muted\">"+esc(service.category)+" · "+esc(service.duration||"")+"</span><span class=\"price\">"+service.price+" "+esc(service.currency)+"</span><div class=\"actions\"><button class=\"secondary edit\">تعديل</button><button class=\"danger delete\">حذف</button></div>";card.querySelector(".edit").onclick=function(){openEdit(service)};card.querySelector(".delete").onclick=function(){removeService(service.id)};$("services").appendChild(card)})}function openEdit(service){editing=service;$("title").value=service.title;$("titleAr").value=service.titleAr||"";$("category").value=service.category;$("price").value=service.price;$("currency").value=service.currency;$("duration").value=service.duration||"";$("description").value=service.description||"";$("serviceDialog").showModal()}$("newService").onclick=function(){editing=null;$("serviceForm").reset();$("currency").value="EUR";$("serviceDialog").showModal()};$("cancelDialog").onclick=function(){$("serviceDialog").close()};$("serviceForm").onsubmit=async function(event){event.preventDefault();try{var image=await readImage($("image").files[0]);var body={title:$("title").value,titleAr:$("titleAr").value,category:$("category").value,price:Number($("price").value),currency:$("currency").value,duration:$("duration").value,description:$("description").value};if(image!==undefined)body.imageData=image;await api(editing?"/admin/services/"+editing.id:"/admin/services",{method:editing?"PUT":"POST",body:JSON.stringify(body)});$("serviceDialog").close();await load()}catch(error){show("serviceError",error.message,false)}};async function removeService(id){if(!confirm("هل تريد حذف الخدمة؟"))return;await api("/admin/services/"+id,{method:"DELETE"});await load()}$("loginForm").onsubmit=async function(event){event.preventDefault();show("loginError","");try{await api("/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(error){show("loginError","بيانات الدخول غير صحيحة",false)}};$("logout").onclick=async function(){await api("/auth/logout",{method:"POST"});location.reload()};$("passwordForm").onsubmit=async function(event){event.preventDefault();try{await api("/auth/password",{method:"POST",body:JSON.stringify({currentPassword:$("currentPassword").value,newPassword:$("newPassword").value})});show("passwordMessage","تم تغيير كلمة المرور. سجّل الدخول من جديد.",true);setTimeout(function(){location.reload()},1200)}catch(error){show("passwordMessage",error.message,false)}};(async function(){try{await api("/auth/me");$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(error){}})();
    </script></body></html>
