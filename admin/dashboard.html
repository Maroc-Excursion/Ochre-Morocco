<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة التحكم — Ochre Morocco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--green:#0E5A47;--green2:#17785f;--gold:#C89B3C;--navy:#0F2238;--sand:#E8D9B5;--bg:#f5f7f7;--ink:#173047;--muted:#6b7b88;--line:#e2e8eb;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif}button,input,textarea,select{font:inherit}
    .shell{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--navy);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:2}
    .brand{padding:4px 10px 27px;border-bottom:1px solid #ffffff1c}.brand strong{font:700 23px 'Playfair Display',serif;color:var(--sand)}.brand small{display:block;color:#b8c7d0;font-size:11px;margin-top:4px}
    .nav{padding-top:26px;display:grid;gap:7px}.nav button{border:0;background:transparent;color:#c4d0d6;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff13;color:#fff}.nav button span{margin-right:9px}
    .logout{margin-top:auto;border:1px solid #ffffff2d;background:transparent;color:#fff;padding:11px;border-radius:9px;cursor:pointer}.main{margin-left:248px;width:calc(100% - 248px);padding:30px;max-width:1500px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}.top h1{font:700 31px 'Playfair Display',serif;margin:0 0 5px}.top p{margin:0;color:var(--muted);font-size:13px}.primary{background:var(--green);border:0;color:#fff;padding:11px 17px;border-radius:9px;cursor:pointer;font-weight:600}.primary:hover{background:var(--green2)}
    .notice{display:none;padding:12px 15px;border-radius:9px;margin-bottom:18px;font-size:13px}.notice.error{display:block;background:#fff0ef;color:var(--danger);border:1px solid #f5c7c3}.notice.success{display:block;background:#edf9f2;color:#167044;border:1px solid #b7e2c7}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 20px #17304708}.stat{padding:19px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;color:var(--green);margin-top:7px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.panel-head h2{font-size:17px;margin:0}.filters{display:flex;gap:9px}.filters input,.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;outline:0;background:#fff;color:var(--ink)}
    table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:right;color:var(--muted);font-weight:600;padding:11px 8px;border-bottom:1px solid var(--line)}td{padding:12px 8px;border-bottom:1px solid #eef1f2;vertical-align:middle}.thumb{width:53px;height:42px;object-fit:cover;border-radius:7px;background:#eef2f1}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:30px;font-size:10px;background:#eef5f2;color:var(--green)}.pill.off,.pill.cancelled{background:#fff0ef;color:var(--danger)}.pill.pending{background:#fff7e6;color:#956b11}.pill.confirmed{background:#edf9f2;color:#167044}.actions{display:flex;gap:5px}.icon-btn{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:11px}.icon-btn.danger{color:var(--danger)}
    .view{display:none}.view.active{display:block}.empty{text-align:center;color:var(--muted);padding:40px 10px}.modal-backdrop{display:none;position:fixed;inset:0;background:#0f223899;z-index:10;place-items:center;padding:20px}.modal-backdrop.open{display:grid}.modal{background:#fff;width:min(100%,680px);max-height:92vh;overflow:auto;border-radius:16px;padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h2{font:700 23px 'Playfair Display',serif;margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;margin-bottom:13px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:600}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;outline:0;color:var(--ink)}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green)}.check{display:flex;align-items:center;gap:9px;font-size:13px}.modal-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer}.upload-note{font-size:11px;color:var(--muted)}
    @media(max-width:800px){.sidebar{width:72px;padding:18px 9px}.brand strong{font-size:0}.brand strong:after{content:'OM';font:700 18px 'Playfair Display',serif}.brand small,.nav button label,.logout label{display:none}.nav button{text-align:center;padding:12px 5px}.nav button span{margin:0}.main{margin-left:72px;width:calc(100% - 72px);padding:20px 14px}.stats{grid-template-columns:1fr 1fr}.top{align-items:center}.top h1{font-size:24px}.panel{overflow:auto}.panel-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters input{width:100%}}
    @media(max-width:530px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><strong>Ochre Morocco</strong><small>إدارة الموقع والحجوزات</small></div>
      <nav class="nav">
        <button class="active" data-view="excursions"><span>✦</span><label>الرحلات</label></button>
        <button data-view="bookings"><span>▣</span><label>الحجوزات</label></button>
      </nav>
      <button class="logout" id="logout"><span>↪</span> <label>تسجيل الخروج</label></button>
    </aside>
    <main class="main">
      <header class="top"><div><h1 id="page-title">الرحلات والخدمات</h1><p id="user-email">جارٍ التحقق من الجلسة…</p></div><button class="primary" id="new-excursion">＋ إضافة رحلة جديدة</button></header>
      <div id="notice" class="notice" role="alert"></div>
      <section id="view-excursions" class="view active">
        <div class="stats"><div class="stat"><small>كل الرحلات</small><strong id="stat-all">—</strong></div><div class="stat"><small>الرحلات المفعّلة</small><strong id="stat-active">—</strong></div><div class="stat"><small>الدوائر السياحية</small><strong id="stat-circuits">—</strong></div><div class="stat"><small>الترانسفير</small><strong id="stat-transfers">—</strong></div></div>
        <div class="panel"><div class="panel-head"><h2>جميع الرحلات</h2><div class="filters"><input id="search" type="search" placeholder="بحث بالعنوان…"><select id="category-filter"><option value="">كل الفئات</option><option value="excursion">رحلة</option><option value="circuit">دائرة</option><option value="transfert">ترانسفير</option></select></div></div><div id="excursion-table"></div></div>
      </section>
      <section id="view-bookings" class="view">
        <div class="panel"><div class="panel-head"><h2>الحجوزات</h2><button class="secondary" id="refresh-bookings">تحديث</button></div><div id="booking-table"></div></div>
      </section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal">
    <form class="modal" id="excursion-form">
      <div class="modal-head"><h2 id="modal-title">إضافة رحلة جديدة</h2><button class="close" type="button" id="close-modal">×</button></div>
      <input type="hidden" id="record-id">
      <div class="form-grid">
        <div class="field full"><label for="title">العنوان *</label><input id="title" required></div>
        <div class="field full"><label for="description">الوصف</label><textarea id="description"></textarea></div>
        <div class="field"><label for="price">السعر *</label><input id="price" type="number" min="0" step="0.01" required></div>
        <div class="field"><label for="duration">المدة</label><input id="duration" placeholder="يوم كامل / 3 أيام"></div>
        <div class="field"><label for="category">الفئة *</label><select id="category" required><option value="excursion">رحلة</option><option value="circuit">دائرة سياحية</option><option value="transfert">ترانسفير</option></select></div>
        <div class="field"><label for="image">الصورة</label><input id="image" type="file" accept="image/*"><span class="upload-note">تُرفع الصورة إلى excursion-images بعد تسجيل الدخول.</span></div>
        <div class="field full"><label class="check"><input id="active" type="checkbox" checked> الرحلة مفعّلة وتظهر للزوار</label></div>
      </div>
      <div class="modal-actions"><button class="primary" type="submit" id="save-button">حفظ الرحلة</button><button class="secondary" type="button" id="cancel-modal">إلغاء</button></div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    (function () {
      'use strict';
      var client = window.OchreSupabase && window.OchreSupabase.client;
      var state = { excursions: [], bookings: [] };
      var $ = function (id) { return document.getElementById(id); };
      function showNotice(message, type) { var el = $('notice'); el.textContent = message; el.className = 'notice ' + (type || 'error'); window.clearTimeout(showNotice.timer); showNotice.timer = window.setTimeout(function () { el.className = 'notice'; }, 5000); }
      function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
      function imageUrl(value) { return value && window.OchreSupabase.imageUrl(value); }
      function formatDate(value) { return value ? new Date(value).toLocaleDateString('ar-MA') : '—'; }
      async function init() {
        if (!client) { showNotice('تعذر تحميل Supabase. تحقق من الاتصال.', 'error'); return; }
        var session = (await client.auth.getSession()).data.session;
        if (!session) { window.location.replace('login.html'); return; }
        $('user-email').textContent = session.user.email || 'حساب مدير';
        await loadExcursions();
        await loadBookings();
      }
      async function loadExcursions() {
        var result = await client.from('excursions').select('*').order('created_at', { ascending: false });
        if (result.error) { showNotice('تعذر تحميل الرحلات: ' + result.error.message); return; }
        state.excursions = result.data || []; renderExcursions(); updateStats();
      }
      async function loadBookings() {
        var result = await client.from('bookings').select('*, excursions(title)').order('created_at', { ascending: false });
        if (result.error) { showNotice('تعذر تحميل الحجوزات: ' + result.error.message); return; }
        state.bookings = result.data || []; renderBookings();
      }
      function updateStats() {
        $('stat-all').textContent = state.excursions.length; $('stat-active').textContent = state.excursions.filter(function (x) { return x.is_active; }).length;
        $('stat-circuits').textContent = state.excursions.filter(function (x) { return x.category === 'circuit'; }).length;
        $('stat-transfers').textContent = state.excursions.filter(function (x) { return x.category === 'transfert'; }).length;
      }
      function renderExcursions() {
        var query = $('search').value.trim().toLowerCase(), category = $('category-filter').value;
        var list = state.excursions.filter(function (item) { return (!category || item.category === category) && (!query || item.title.toLowerCase().includes(query)); });
        if (!list.length) { $('excursion-table').innerHTML = '<div class="empty">لا توجد رحلات مطابقة.</div>'; return; }
        $('excursion-table').innerHTML = '<table><thead><tr><th>الصورة</th><th>العنوان</th><th>الفئة</th><th>السعر</th><th>المدة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>' + list.map(function (item) {
          var src = imageUrl(item.image_url);
          return '<tr><td>' + (src ? '<img class="thumb" src="' + esc(src) + '" alt="">' : '<span class="muted">—</span>') + '</td><td><strong>' + esc(item.title) + '</strong><br><span class="muted">' + esc(item.slug) + '</span></td><td>' + esc({excursion:'رحلة',circuit:'دائرة',transfert:'ترانسفير'}[item.category] || item.category) + '</td><td>€' + esc(item.price) + '</td><td>' + esc(item.duration || '—') + '</td><td><span class="pill ' + (item.is_active ? '' : 'off') + '">' + (item.is_active ? 'مفعّلة' : 'مخفية') + '</span></td><td><div class="actions"><button class="icon-btn" data-edit="' + item.id + '">تعديل</button><button class="icon-btn danger" data-delete="' + item.id + '">حذف</button></div></td></tr>';
        }).join('') + '</tbody></table>';
      }
      function renderBookings() {
        if (!state.bookings.length) { $('booking-table').innerHTML = '<div class="empty">لا توجد حجوزات حتى الآن.</div>'; return; }
        $('booking-table').innerHTML = '<table><thead><tr><th>الرحلة</th><th>العميل</th><th>التواصل</th><th>التاريخ</th><th>الأشخاص</th><th>الحالة</th><th></th></tr></thead><tbody>' + state.bookings.map(function (item) {
          var status = item.status || 'pending', title = item.excursions && item.excursions.title || 'رحلة محذوفة';
          return '<tr><td><strong>' + esc(title) + '</strong></td><td>' + esc(item.client_name) + '<br><span class="muted">' + esc(item.client_email) + '</span></td><td>' + esc(item.client_phone || '—') + '</td><td>' + formatDate(item.booking_date) + '</td><td>' + esc(item.people_count) + '</td><td><select class="status-select pill ' + status + '" data-status="' + item.id + '"><option value="pending" ' + (status === 'pending' ? 'selected' : '') + '>pending</option><option value="confirmed" ' + (status === 'confirmed' ? 'selected' : '') + '>confirmed</option><option value="cancelled" ' + (status === 'cancelled' ? 'selected' : '') + '>cancelled</option></select></td><td><button class="icon-btn danger" data-booking-delete="' + item.id + '">حذف</button></td></tr>';
        }).join('') + '</tbody></table>';
      }
      function openForm(item) {
        $('modal-title').textContent = item ? 'تعديل الرحلة' : 'إضافة رحلة جديدة'; $('record-id').value = item ? item.id : ''; $('title').value = item ? item.title : ''; $('description').value = item ? item.description : ''; $('price').value = item ? item.price : ''; $('duration').value = item ? item.duration : ''; $('category').value = item ? item.category : 'excursion'; $('active').checked = item ? item.is_active : true; $('image').value = ''; $('modal').classList.add('open');
      }
      function closeForm() { $('modal').classList.remove('open'); }
      async function saveExcursion(event) {
        event.preventDefault(); var button = $('save-button'); button.disabled = true; button.textContent = 'جارٍ الحفظ…';
        try {
          var id = $('record-id').value, title = $('title').value.trim(), existing = state.excursions.find(function (x) { return x.id === id; }), imageUrlValue = existing ? existing.image_url : '', file = $('image').files[0];
          if (file) {
            var path = crypto.randomUUID() + '-' + file.name.toLowerCase().replace(/[^a-z0-9._-]/g, '-');
            var uploaded = await client.storage.from('excursion-images').upload(path, file, { upsert: false, contentType: file.type });
            if (uploaded.error) throw uploaded.error; imageUrlValue = uploaded.data.path;
          }
          var payload = { title: title, slug: existing ? existing.slug : window.OchreSupabase.slugify(title), description: $('description').value.trim(), price: Number($('price').value), duration: $('duration').value.trim(), category: $('category').value, image_url: imageUrlValue, is_active: $('active').checked };
          var result = id ? await client.from('excursions').update(payload).eq('id', id) : await client.from('excursions').insert(payload);
          if (result.error) throw result.error; closeForm(); showNotice('تم حفظ الرحلة بنجاح.', 'success'); await loadExcursions();
        } catch (error) { showNotice('تعذر حفظ الرحلة: ' + error.message); } finally { button.disabled = false; button.textContent = 'حفظ الرحلة'; }
      }
      async function deleteExcursion(id) { if (!window.confirm('هل تريد حذف هذه الرحلة نهائياً؟')) return; var result = await client.from('excursions').delete().eq('id', id); if (result.error) { showNotice('تعذر حذف الرحلة: ' + result.error.message); return; } showNotice('تم حذف الرحلة.', 'success'); await loadExcursions(); }
      async function updateBooking(id, status) { var result = await client.from('bookings').update({ status: status }).eq('id', id); if (result.error) showNotice('تعذر تحديث الحجز: ' + result.error.message); else { showNotice('تم تحديث حالة الحجز.', 'success'); await loadBookings(); } }
      async function deleteBooking(id) { if (!window.confirm('هل تريد حذف هذا الحجز؟')) return; var result = await client.from('bookings').delete().eq('id', id); if (result.error) showNotice('تعذر حذف الحجز: ' + result.error.message); else await loadBookings(); }
      document.querySelectorAll('.nav button').forEach(function (button) { button.addEventListener('click', function () { document.querySelectorAll('.nav button').forEach(function (x) { x.classList.remove('active'); }); button.classList.add('active'); document.querySelectorAll('.view').forEach(function (x) { x.classList.remove('active'); }); $('view-' + button.dataset.view).classList.add('active'); $('page-title').textContent = button.dataset.view === 'bookings' ? 'الحجوزات' : 'الرحلات والخدمات'; $('new-excursion').style.display = button.dataset.view === 'bookings' ? 'none' : ''; }); });
      $('new-excursion').addEventListener('click', function () { openForm(); }); $('close-modal').addEventListener('click', closeForm); $('cancel-modal').addEventListener('click', closeForm); $('excursion-form').addEventListener('submit', saveExcursion); $('search').addEventListener('input', renderExcursions); $('category-filter').addEventListener('change', renderExcursions); $('refresh-bookings').addEventListener('click', loadBookings);
      $('excursion-table').addEventListener('click', function (event) { var edit = event.target.dataset.edit, del = event.target.dataset.delete; if (edit) openForm(state.excursions.find(function (x) { return x.id === edit; })); if (del) deleteExcursion(del); });
      $('booking-table').addEventListener('change', function (event) { if (event.target.dataset.status) updateBooking(event.target.dataset.status, event.target.value); }); $('booking-table').addEventListener('click', function (event) { if (event.target.dataset.bookingDelete) deleteBooking(event.target.dataset.bookingDelete); });
      $('logout').addEventListener('click', async function () { await client.auth.signOut(); window.location.replace('login.html'); }); client.auth.onAuthStateChange(function (event, session) { if (event === 'SIGNED_OUT' || !session) window.location.replace('login.html'); }); init();
    })();
  </script>
</body>
</html>
